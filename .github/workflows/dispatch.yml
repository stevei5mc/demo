name: dispatch

on:
  workflow_dispatch:
    inputs:
      build-plugin:
        description: 'Build plugin'
        required: false
        default: true
        type: boolean
      build-Docusaurus:
        description: 'Build docusaurus'
        required: false
        default: true
        type: boolean
      additional-functions:
        description: "Additional functions"
        required: false
        default: 'Not used'
        type: choice
        options:
        - Not used
        - PR Approve
        - Deploy gitHub pages
      PR_ID:
        description: 'PR Approve ID'
        required: false
      Release_version:
        description: 'Release version'
        required: false

jobs:
  T1:
    name: test1
    runs-on: ubuntu-slim
    outputs:
      repo_name: ${{ steps.get_info.outputs.repo_name }}
      artifact_name: ${{ steps.get_info.outputs.repo_name }}-Dispatch-Build_${{ github.run_number }}
      additional-functions: ${{ steps.get_info.outputs.additional-functions }}
      PR_ID: ${{ steps.get_info.outputs.PR_ID }}
      url: ${{ steps.get_info.outputs.url }}
    steps:
    - name: 获取信息
      id: get_info
      run: |
        echo "repo_name=${GITHUB_REPOSITORY/${{ github.repository_owner }}\//}" >> $GITHUB_OUTPUT
        echo "additional-functions=${{ inputs.additional-functions }}" >> $GITHUB_OUTPUT
        echo "PR_ID=${{ inputs.PR_ID }}" >> $GITHUB_OUTPUT

  T2:
    name: test
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        include:
        - {type: ABCDEFG}
        - {type: HIJKLMN}
        - {type: OPQRST}
        - {type: UVWXYZ}
        exclude:
        - {type: UVWXYZ}
    steps:
    - name: 获取信息
      id: get_info
      run: |
        echo "${{ matrix.type }}"
