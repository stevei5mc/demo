name: dispatch

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo'
        required: true
      branch:
        description: 'branch'
        required: true
      java-version:
        description: 'Java version'
        required: true
      build-command:
        description: 'Build command'
        required: true
      files-path:
        description: 'Files path'
        required: true

jobs:
  T1:
    name: test1
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.branch}}
        fetch-depth: 0
        path: ./repo
    - run: ls -lah
    - name: 安装java${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: '${{ inputs.java-version }}'
        distribution: 'temurin'
    - name: 构建
      run: cd ./repo && pwd && ${{ inputs.build-command }} && cd ../
    - name: 复制文件
      run:  |
        ls -la
        mkdir ./staging && cp ./repo/${{ inputs.files-path }} ./staging
    - name: 收集构建文件
      uses: actions/upload-artifact@v6
      with:
        name: action_id_${{ github.run_number }}
        path: staging