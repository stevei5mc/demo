name: workflow test
on:
  push:
  workflow_dispatch:
  pull_request:

env:
  token1: ${{ github.token }}
  token2: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  TEST:
    strategy:
      fail-fast: false
      matrix:
        include: [{os: ubuntu-latest},{os: ubuntu-slim}]
    runs-on: ${{ matrix.os }}
    name: Test     
    steps:
    - name: Get info
      run: |
        echo ::group::A001
        wget https://github.com/fastfetch-cli/fastfetch/releases/download/2.55.1/fastfetch-linux-amd64.deb
        echo ::endgroup::
        echo ::group::A002
        sudo apt install ./fastfetch-linux-amd64.deb
        echo ::endgroup::
        echo ::group::A003
        fastfetch
        echo ::endgroup::
        echo ::group::A004
        lscpu | grep -E "Model name|Core|Socket|Thread"
        echo ::endgroup::
    - name: Test1
      if: success() || failure()
      run: |
        mkdir test1
        cd test1
        pwd
        git init
        git remote add origin https://github.com/stevei5mc/demo.git
        gh pr checkout 4
        ls -lah
        cd ../
    - name: Test2
      if: success() ||  failure()
      run: |
        mkdir test2
        cd test2
        pwd
        git init
        git remote add origin https://github.com/Predidit/Kazumi.git
        gh pr checkout 601
        ls -lah
        cd ../