name: workflow test
on:
  push:
  workflow_dispatch:
  pull_request:

env:
  token1: ${{ github.token }}
  token2: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  TEST1:
    runs-on: ubuntu-latest
    name: Test1 
    steps:
    - name: Get info
      run: |
        echo ::group::A001
        wget https://github.com/fastfetch-cli/fastfetch/releases/download/2.55.1/fastfetch-linux-amd64.deb
        echo ::endgroup::
        echo ::group::A002
        sudo apt install ./fastfetch-linux-amd64.deb
        echo ::endgroup::
        echo ::group::A003
        fastfetch
        echo ::endgroup::
        echo ::group::A004
        lscpu | grep -E "Model name|Core|Socket|Thread"
        echo ::endgroup::

  TEST2:
    runs-on: ubuntu-24.04-arm
    name: Test2
    steps:
    - name: Get info
      run: |
        echo ::group::A001
        wget https://github.com/fastfetch-cli/fastfetch/releases/download/2.55.1/fastfetch-linux-aarch64.deb
        echo ::endgroup::
        echo ::group::A002
        sudo apt install ./fastfetch-linux-aarch64.deb
        echo ::endgroup::
        echo ::group::A003
        fastfetch
        echo ::endgroup::
        echo ::group::A004
        lscpu | grep -E "Model name|Core|Socket|Thread"
        echo ::endgroup::

  TEST3:
    runs-on: windows-latest
    name: Test3
    steps:
    - name: Download fastfetch
      uses: robinraju/release-downloader@v1.11
      with:
        repository: 'fastfetch-cli/fastfetch'
        tag: '2.55.1'
        fileName: 'fastfetch-windows-amd64.zip'
    - run: unzip fastfetch-windows-amd64.zip && ls -la
      shell: bash
    - run: fastfetch.exe
      shell: cmd

  TEST4:
    runs-on: windows-11-arm
    name: Test4
    steps:
    - name: Download fastfetch
      uses: robinraju/release-downloader@v1.11
      with:
        repository: 'fastfetch-cli/fastfetch'
        tag: '2.55.1'
        fileName: 'fastfetch-windows-aarch64.zip'
    - run: unzip fastfetch-windows-aarch64.zip && ls -la
      shell: bash
    - run: fastfetch.exe
      shell: cmd