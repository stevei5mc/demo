name: workflow test
on:
  push:
  workflow_dispatch:
  pull_request:

env:
  token1: ${{ github.token }}
  token2: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  TEST:
    strategy:
      fail-fast: false
      matrix:
        include: [
          {os: ubuntu-latest},{os: ubuntu-slim}
        ]
    runs-on: ${{ matrix.os }}
    name: Test     
    steps:
    - name: Get info
      run: |
        echo ::group::A001
        lsb_release -a
        echo ::endgroup::
        echo ::group::A002
        uname -a
        echo ::endgroup::
        echo ::group::A003
        lscpu | grep -E "Model name|Core|Socket|Thread"
        echo ::endgroup::
        echo ::group::A004
        free -h
        echo ::endgroup::
        echo ::group::A005
        df -h
        echo ::endgroup::
        echo ::group::A006
        ip addr show
        echo ::endgroup::
        echo ::group::A007
        env
        echo ::endgroup::
    - name: Test1
      if: success() && failure()
      run: |
        mkdir test1
        cd test1
        git init
        git remote add origin https://github.com/stevei5mc/demo.git
        gh pr checkout 4
        cd ../
    - name: Test2
      if: success() &&  failure()
      run: |
        mkdir test2
        cd test2
        git init
        git remote add origin https://github.com/stevei5mc/demo.git
        git pull
        gh pr checkout 4
        cd ../